<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ff78b7">
<title>Pixel Pink Calculator</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#fff0f7;--panel:#fff8fc;--display:#ffe0ef;--key:#ffd0e5;--key2:#ffb6d7;--accent:#ff5ca8;--accentDark:#d92f80;--text:#54243e;--muted:#a35c80;--border:#54243e;--shadow:#d986ad}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100dvh;background:var(--panel);color:var(--text);font-family:"Courier New",monospace;display:flex;justify-content:center;align-items:center;padding:16px}button{font:inherit;color:inherit}.app{width:min(100%,410px);background:var(--panel);border:0;box-shadow:none;padding:14px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:1px;font-size:13px}.heart{font-size:24px;color:var(--accentDark);text-shadow:2px 2px #ffc0dd}.topActions{display:flex;gap:7px;margin-left:auto}.iconBtn{border:3px solid var(--border);background:var(--key);min-width:38px;height:34px;display:grid;place-items:center;cursor:pointer;box-shadow:3px 3px var(--shadow);font-weight:bold}.screen{background:var(--display);border:4px solid var(--border);padding:14px 12px 10px;min-height:125px;display:flex;flex-direction:column;justify-content:space-between;margin-bottom:14px}.screenLabel{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;font-weight:bold;letter-spacing:1px}.expression{min-height:23px;font-size:15px;text-align:right;overflow-wrap:anywhere;color:var(--muted);padding-top:10px}.result{font-size:clamp(28px,8vw,38px);font-weight:900;text-align:right;white-space:nowrap;overflow-x:auto;line-height:1.2}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.key{border:3px solid var(--border);background:var(--key);min-height:59px;cursor:pointer;box-shadow:4px 4px var(--shadow);font-size:20px;font-weight:900;display:flex;align-items:center;justify-content:center;user-select:none}.key:active,.iconBtn:active{transform:translate(2px,2px);box-shadow:1px 1px var(--shadow)}.function{background:#ffe6f2;color:var(--accentDark);font-size:16px}.operator{background:var(--key2)}.operator.selected{outline:3px dashed var(--accentDark);outline-offset:-7px}.equals{background:var(--accent);color:white}.toast{min-height:15px;color:var(--accentDark);font-size:11px;text-align:center;margin-top:8px}.history{display:none;margin-top:14px;border:3px solid var(--border);background:var(--bg);padding:10px}.history.open{display:block}.historyHead{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:bold;margin-bottom:8px}.historyList{max-height:150px;overflow:auto}.historyItem{padding:8px 2px;border-top:2px dashed #f3a5ca;cursor:pointer}.historyExp{color:var(--muted);font-size:11px}.historyResult{font-size:16px;font-weight:bold;text-align:right}.empty{color:var(--muted);font-size:12px;padding:8px 0}.footer{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:var(--muted);font-size:10px;letter-spacing:1px}.status{display:flex;align-items:center;gap:6px}.dot{width:8px;height:8px;background:#56b77b;border:2px solid var(--border)}@media(max-width:360px){body{padding:10px}.app{padding:10px}.key{min-height:53px}.keys{gap:7px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.saveAppOverlay{position:fixed;inset:0;background:rgba(84,36,62,.48);display:none;align-items:center;justify-content:center;padding:20px;z-index:9999}.saveAppOverlay.show{display:flex}.saveAppPopup{width:min(100%,330px);background:var(--panel);border:4px solid var(--border);box-shadow:6px 6px var(--shadow);padding:20px;text-align:center;color:var(--text)}.saveAppTitle{font-size:20px;font-weight:900;margin:0 0 10px}.saveAppText{font-size:13px;line-height:1.5;margin:0 0 18px}.saveAppButtons{display:flex;gap:10px}.saveAppButtons button{flex:1;border:3px solid var(--border);padding:10px 8px;font-weight:900;cursor:pointer;box-shadow:3px 3px var(--shadow)}.saveAppYes{background:var(--accent);color:white}.saveAppNo{background:var(--key)}.saveAppHint{font-size:11px;line-height:1.4;margin:12px 0 0;color:var(--muted)}
</style></head><body>
<div class="saveAppOverlay" id="saveAppOverlay" role="dialog" aria-modal="true" aria-labelledby="saveAppTitle"><div class="saveAppPopup"><p class="saveAppTitle" id="saveAppTitle">♥ Save as App?</p><p class="saveAppText">Keep your Pixel Pink Calculator handy on your device.</p><div class="saveAppButtons"><button class="saveAppYes" id="saveAppYes">YES</button><button class="saveAppNo" id="saveAppNo">NOT NOW</button></div><p class="saveAppHint" id="saveAppHint" hidden></p></div></div>
<main class="app" aria-label="Pixel Pink Calculator"><header class="topbar"><div class="topActions"><button class="iconBtn" id="historyToggle" aria-label="Toggle calculation history" title="History">▤</button><button class="iconBtn" id="themeToggle" aria-label="Toggle pink theme shade" title="Change theme">☼</button></div></header>
<section class="screen" aria-live="polite" aria-label="Calculator display"><div class="expression" id="expression">&nbsp;</div><div class="result" id="result">0</div></section>
<section class="keys" aria-label="Calculator keys"><button class="key function" data-action="clear">AC</button><button class="key function" data-action="sign">+/−</button><button class="key function" data-action="percent">%</button><button class="key operator" data-op="÷" aria-label="Divide">÷</button>
<button class="key" data-digit="7">7</button><button class="key" data-digit="8">8</button><button class="key" data-digit="9">9</button><button class="key operator" data-op="×" aria-label="Multiply">×</button>
<button class="key" data-digit="4">4</button><button class="key" data-digit="5">5</button><button class="key" data-digit="6">6</button><button class="key operator" data-op="−" aria-label="Subtract">−</button>
<button class="key" data-digit="1">1</button><button class="key" data-digit="2">2</button><button class="key" data-digit="3">3</button><button class="key operator" data-op="+" aria-label="Add">+</button>
<button class="key function" data-action="backspace" aria-label="Delete last digit">⌫</button><button class="key zero" data-digit="0">0</button><button class="key" data-action="decimal">.</button><button class="key equals" data-action="equals" aria-label="Equals">=</button></section>
<div class="toast" id="toast" role="status"></div><section class="history" id="historyPanel" aria-label="Calculation history"><div class="historyHead"><span>♥ RECENT CALCULATIONS</span><button class="iconBtn" id="clearHistory" aria-label="Clear history" style="height:27px;min-width:30px;font-size:12px">×</button></div><div class="historyList" id="historyList"><div class="empty">Your calculations will appear here.</div></div></section></main>
<script>(()=>{const $=id=>document.getElementById(id),out=$('result'),exp=$('expression'),mode=$('mode'),toast=$('toast');let current='0',stored=null,operator=null,waiting=false,expression='',evaluated=false,history=[];function fmt(n){if(!Number.isFinite(n))return'Error';if(Object.is(n,-0))n=0;if(Math.abs(n)>=1e12||(Math.abs(n)>0&&Math.abs(n)<1e-7))return n.toExponential(6).replace(/\.?0+e/,'e').replace('e+','e');return String(Number(n.toPrecision(11)))}function render(){out.textContent=current;exp.textContent=expression||'\u00a0';mode.textContent=operator&&waiting?'WAITING…':evaluated?'RESULT ✓':'READY ●';document.querySelectorAll('[data-op]').forEach(b=>b.classList.toggle('selected',b.dataset.op===operator&&waiting))}function msg(s){toast.textContent=s;if(s)setTimeout(()=>{if(toast.textContent===s)toast.textContent=''},1800)}function clear(){current='0';stored=null;operator=null;waiting=false;expression='';evaluated=false;render();msg('')}function digit(d){if(current==='Error'||evaluated){current=d;expression='';evaluated=false;stored=null;operator=null}else if(waiting){current=d;waiting=false}else if(current==='0')current=d;else if(current==='-0')current='-'+d;else if(current.replace(/[-.]/g,'').length<15)current+=d;render()}function decimal(){if(current==='Error'||evaluated){current='0.';evaluated=false;stored=null;operator=null;expression=''}else if(waiting){current='0.';waiting=false}else if(!current.includes('.'))current+='.';render()}function calc(a,b,op){return op==='+'?a+b:op==='−'?a-b:op==='×'?a*b:op==='÷'?(b===0?NaN:a/b):b}function choose(op){if(current==='Error')return;let n=Number(current);if(operator&&!waiting){let r=calc(stored,n,operator);if(!Number.isFinite(r)){current='Error';stored=null;operator=null;expression='Cannot divide by zero';render();return}current=fmt(r);stored=r}else stored=n;operator=op;waiting=true;evaluated=false;expression=fmt(stored)+' '+op;render()}function equals(){if(!operator||stored===null||current==='Error')return;let a=stored,b=waiting?stored:Number(current),op=operator,full=fmt(a)+' '+op+' '+fmt(b)+' =',r=calc(a,b,op);if(!Number.isFinite(r)){current='Error';expression='Cannot divide by zero';msg('Cannot divide by zero')}else{current=fmt(r);expression=full;history.unshift({expression:full,result:current});history=history.slice(0,30);renderHistory()}stored=null;operator=null;waiting=false;evaluated=true;render()}function sign(){if(current!=='Error'&&Number(current)!==0)current=current.startsWith('-')?current.slice(1):'-'+current;render()}function percent(){if(current!=='Error')current=fmt(Number(current)/100);render()}function backspace(){if(current==='Error'||evaluated||waiting){current='0';evaluated=false}else if(current.length<=1||(current.length===2&&current.startsWith('-')))current='0';else current=current.slice(0,-1);render()}function renderHistory(){let list=$('historyList');list.replaceChildren();if(!history.length){let e=document.createElement('div');e.className='empty';e.textContent='Your calculations will appear here.';list.append(e);return}history.forEach(item=>{let row=document.createElement('div');row.className='historyItem';row.tabIndex=0;row.setAttribute('role','button');let e=document.createElement('div');e.className='historyExp';e.textContent=item.expression;let r=document.createElement('div');r.className='historyResult';r.textContent='= '+item.result;row.append(e,r);const reuse=()=>{current=item.result;stored=null;operator=null;waiting=false;evaluated=true;expression=item.expression;render()};row.addEventListener('click',reuse);row.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();reuse()}});list.append(row)})}document.querySelector('.keys').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.digit!==undefined)digit(b.dataset.digit);else if(b.dataset.op)choose(b.dataset.op);else switch(b.dataset.action){case'clear':clear();break;case'sign':sign();break;case'percent':percent();break;case'decimal':decimal();break;case'backspace':backspace();break;case'equals':equals();break}});$('historyToggle').addEventListener('click',()=>$('historyPanel').classList.toggle('open'));$('clearHistory').addEventListener('click',()=>{history=[];renderHistory();msg('History cleared')});$('themeToggle').addEventListener('click',()=>{let root=document.documentElement,berry=root.dataset.theme!=='berry';root.dataset.theme=berry?'berry':'';let vars=berry?{'--bg':'#ffe9f0','--panel':'#fff6f8','--display':'#ffd5df','--key':'#ffc1d0','--key2':'#ff9fb8','--accent':'#ff477e','--accentDark':'#bd2454','--text':'#4b1f32','--muted':'#98516a','--shadow':'#d97894'}:{'--bg':'#fff0f7','--panel':'#fff8fc','--display':'#ffe0ef','--key':'#ffd0e5','--key2':'#ffb6d7','--accent':'#ff5ca8','--accentDark':'#d92f80','--text':'#54243e','--muted':'#a35c80','--shadow':'#d986ad'};Object.entries(vars).forEach(([k,v])=>root.style.setProperty(k,v));msg(berry?'Berry pink mode ♥':'Classic pink mode ♥')});document.addEventListener('keydown',e=>{if(/^[0-9]$/.test(e.key)){digit(e.key);e.preventDefault()}else if(e.key==='.'){decimal();e.preventDefault()}else if(['+','-','*','/'].includes(e.key)){choose(({'+':'+','-':'−','*':'×','/':'÷'})[e.key]);e.preventDefault()}else if(e.key==='Enter'||e.key==='='){equals();e.preventDefault()}else if(e.key==='Backspace'){backspace();e.preventDefault()}else if(e.key==='Escape'||e.key==='Delete'){clear();e.preventDefault()}else if(e.key==='%'){percent();e.preventDefault()}});render()})();</script>
<script>
(()=> {
 const overlay=document.getElementById('saveAppOverlay');
 const yes=document.getElementById('saveAppYes');
 const no=document.getElementById('saveAppNo');
 const hint=document.getElementById('saveAppHint');
 let installPrompt=null;
 const isInstalled=()=>window.matchMedia('(display-mode: standalone)').matches||window.matchMedia('(display-mode: minimal-ui)').matches||window.navigator.standalone===true;
 if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){
   window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
 }
 window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();installPrompt=event;});
 window.addEventListener('appinstalled',()=>{installPrompt=null;overlay.classList.remove('show');});
 window.addEventListener('load',()=>{
   if(!isInstalled()) overlay.classList.add('show');
 });
 no.addEventListener('click',()=>overlay.classList.remove('show'));
 yes.addEventListener('click',async()=>{
   if(isInstalled()){overlay.classList.remove('show');return;}
   if(installPrompt){
     installPrompt.prompt();
     const choice=await installPrompt.userChoice;
     if(choice&&choice.outcome==='accepted'){overlay.classList.remove('show');}
     installPrompt=null;
   }else{
     hint.hidden=false;
     hint.textContent='To install, open this page on HTTPS in a supported browser. Use your browser menu and choose “Install app” or “Add to Home Screen”.';
     if(/iphone|ipad|ipod/i.test(navigator.userAgent)) hint.textContent='To install on iPhone or iPad, open this page in Safari, tap Share, then choose “Add to Home Screen”.';
   }
 });
})();
</script>
</body></html>
